<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <!-- Background -->
  <rect width="900" height="560" fill="#0a0c0f"/>
  <!-- Grid lines -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2530" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="900" height="560" fill="url(#grid)"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="900" height="60" fill="#111418" stroke="#1e2530" stroke-width="1"/>

  <!-- Shield icon -->
  <rect x="20" y="10" width="40" height="40" rx="8" fill="none" stroke="#00d4aa" stroke-width="1.5"/>
  <path d="M40 48s12-6 12-15V24l-12-4.5L28 24v9c0 9 12 15 12 15z" fill="none" stroke="#00d4aa" stroke-width="1.5"/>

  <!-- Brand name -->
  <text x="72" y="30" fill="#00d4aa" font-size="16" letter-spacing="3" font-weight="bold">VIGILNODE</text>
  <text x="72" y="46" fill="#5a6a7a" font-size="10" letter-spacing="2">SECURITY MONITOR</text>

  <!-- Live dot -->
  <circle cx="780" cy="30" r="5" fill="#00d4aa">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="792" y="34" fill="#5a6a7a" font-size="11" letter-spacing="1">LIVE</text>

  <!-- Logout -->
  <rect x="830" y="18" width="55" height="24" rx="5" fill="none" stroke="#1e2530" stroke-width="1"/>
  <text x="857" y="34" fill="#5a6a7a" font-size="11" text-anchor="middle" letter-spacing="1">LOGOUT</text>

  <!-- Stat cards row -->
  <!-- CPU card -->
  <rect x="20" y="80" width="200" height="90" rx="10" fill="#111418" stroke="#1e2530" stroke-width="1"/>
  <rect x="20" y="80" width="200" height="2" rx="1" fill="#00d4aa"/>
  <text x="36" y="102" fill="#5a6a7a" font-size="9" letter-spacing="2">CPU USAGE</text>
  <text x="36" y="132" fill="#c8d6e5" font-size="30">78<tspan font-size="14" fill="#5a6a7a">%</tspan></text>
  <rect x="36" y="152" width="168" height="4" rx="2" fill="#1e2530"/>
  <rect x="36" y="152" width="131" height="4" rx="2" fill="#f0c040"/>

  <!-- RAM card -->
  <rect x="234" y="80" width="200" height="90" rx="10" fill="#111418" stroke="#1e2530" stroke-width="1"/>
  <rect x="234" y="80" width="200" height="2" rx="1" fill="#00d4aa"/>
  <text x="250" y="102" fill="#5a6a7a" font-size="9" letter-spacing="2">MEMORY</text>
  <text x="250" y="132" fill="#c8d6e5" font-size="30">61<tspan font-size="14" fill="#5a6a7a">%</tspan></text>
  <rect x="250" y="152" width="168" height="4" rx="2" fill="#1e2530"/>
  <rect x="250" y="152" width="103" height="4" rx="2" fill="#00d4aa"/>

  <!-- Disk card -->
  <rect x="448" y="80" width="200" height="90" rx="10" fill="#111418" stroke="#1e2530" stroke-width="1"/>
  <rect x="448" y="80" width="200" height="2" rx="1" fill="#00d4aa"/>
  <text x="464" y="102" fill="#5a6a7a" font-size="9" letter-spacing="2">DISK</text>
  <text x="464" y="132" fill="#c8d6e5" font-size="30">45<tspan font-size="14" fill="#5a6a7a">%</tspan></text>
  <rect x="464" y="152" width="168" height="4" rx="2" fill="#1e2530"/>
  <rect x="464" y="152" width="76" height="4" rx="2" fill="#00d4aa"/>

  <!-- Temp card -->
  <rect x="662" y="80" width="218" height="90" rx="10" fill="#111418" stroke="#1e2530" stroke-width="1"/>
  <rect x="662" y="80" width="218" height="2" rx="1" fill="#00d4aa"/>
  <text x="678" y="102" fill="#5a6a7a" font-size="9" letter-spacing="2">TEMPERATURE</text>
  <text x="678" y="132" fill="#c8d6e5" font-size="30">52<tspan font-size="14" fill="#5a6a7a">°C</tspan></text>
  <rect x="678" y="152" width="186" height="4" rx="2" fill="#1e2530"/>
  <rect x="678" y="152" width="96" height="4" rx="2" fill="#00d4aa"/>

  <!-- Alerts panel -->
  <rect x="20" y="192" width="530" height="350" rx="10" fill="#111418" stroke="#1e2530" stroke-width="1"/>
  <rect x="20" y="192" width="530" height="48" rx="10" fill="#111418" stroke="#1e2530" stroke-width="1"/>
  <rect x="20" y="220" width="530" height="20" fill="#111418"/>
  <text x="40" y="222" fill="#00d4aa" font-size="11" letter-spacing="2">SECURITY ALERTS</text>
  <rect x="480" y="208" width="54" height="20" rx="10" fill="#1e2530"/>
  <text x="507" y="222" fill="#5a6a7a" font-size="11" text-anchor="middle">3</text>
  <line x1="20" y1="240" x2="550" y2="240" stroke="#1e2530" stroke-width="1"/>

  <!-- Alert row 1 - HIGH -->
  <rect x="40" y="256" width="36" height="18" rx="3" fill="#ff445522" stroke="#ff445540" stroke-width="1"/>
  <text x="58" y="269" fill="#ff4455" font-size="9" letter-spacing="1" text-anchor="middle">HIGH</text>
  <text x="88" y="268" fill="#c8d6e5" font-size="13" font-weight="bold">Brute force attempt detected from 192.168.1.45</text>
  <text x="88" y="282" fill="#5a6a7a" font-size="10">5 failed logins in 60s</text>
  <text x="500" y="268" fill="#5a6a7a" font-size="10">10:42:17</text>
  <line x1="40" y1="298" x2="530" y2="298" stroke="#1e2530" stroke-width="1"/>

  <!-- Alert row 2 - MED -->
  <rect x="40" y="310" width="36" height="18" rx="3" fill="#f0c04022" stroke="#f0c04040" stroke-width="1"/>
  <text x="58" y="323" fill="#f0c040" font-size="9" letter-spacing="1" text-anchor="middle">MED</text>
  <text x="88" y="322" fill="#c8d6e5" font-size="13" font-weight="bold">New port opened: 8888</text>
  <text x="88" y="336" fill="#5a6a7a" font-size="10">Not in baseline. Current ports: [22, 5000, 8888]</text>
  <text x="500" y="322" fill="#5a6a7a" font-size="10">09:15:04</text>
  <line x1="40" y1="352" x2="530" y2="352" stroke="#1e2530" stroke-width="1"/>

  <!-- Alert row 3 - LOW -->
  <rect x="40" y="364" width="36" height="18" rx="3" fill="#4488ff22" stroke="#4488ff40" stroke-width="1"/>
  <text x="58" y="377" fill="#4488ff" font-size="9" letter-spacing="1" text-anchor="middle">LOW</text>
  <text x="88" y="376" fill="#c8d6e5" font-size="13" font-weight="bold">Process sustained high CPU: chrome (84.2%)</text>
  <text x="88" y="390" fill="#5a6a7a" font-size="10">PID: 4821</text>
  <text x="500" y="376" fill="#5a6a7a" font-size="10">08:50:31</text>

  <!-- Open ports panel -->
  <rect x="564" y="192" width="316" height="350" rx="10" fill="#111418" stroke="#1e2530" stroke-width="1"/>
  <rect x="564" y="192" width="316" height="48" rx="10" fill="#111418" stroke="#1e2530" stroke-width="1"/>
  <rect x="564" y="220" width="316" height="20" fill="#111418"/>
  <text x="584" y="222" fill="#00d4aa" font-size="11" letter-spacing="2">OPEN PORTS</text>
  <rect x="824" y="208" width="40" height="20" rx="10" fill="#1e2530"/>
  <text x="844" y="222" fill="#5a6a7a" font-size="11" text-anchor="middle">3</text>
  <line x1="564" y1="240" x2="880" y2="240" stroke="#1e2530" stroke-width="1"/>

  <!-- Port tags -->
  <rect x="584" y="260" width="50" height="26" rx="4" fill="#161b22" stroke="#1e2530" stroke-width="1"/>
  <text x="609" y="277" fill="#00d4aa" font-size="12" text-anchor="middle">22</text>

  <rect x="644" y="260" width="62" height="26" rx="4" fill="#161b22" stroke="#1e2530" stroke-width="1"/>
  <text x="675" y="277" fill="#00d4aa" font-size="12" text-anchor="middle">5000</text>

  <rect x="716" y="260" width="62" height="26" rx="4" fill="#161b22" stroke="#1e2530" stroke-width="1"/>
  <text x="747" y="277" fill="#00d4aa" font-size="12" text-anchor="middle">8888</text>
</svg>
