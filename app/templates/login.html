<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VigilNode — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c0f;
    --surface: #111418;
    --border: #1e2530;
    --accent: #00d4aa;
    --accent-dim: #00d4aa22;
    --danger: #ff4455;
    --text: #c8d6e5;
    --text-dim: #5a6a7a;
    --mono: 'Share Tech Mono', monospace;
    --sans: 'Rajdhani', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.4;
    z-index: 0;
  }

  .login-wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
    padding: 20px;
  }

  .logo {
    text-align: center;
    margin-bottom: 40px;
  }

  .logo-icon {
    width: 56px;
    height: 56px;
    border: 2px solid var(--accent);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    box-shadow: 0 0 20px var(--accent-dim);
  }

  .logo-icon svg { width: 28px; height: 28px; }

  .logo h1 {
    font-family: var(--mono);
    font-size: 22px;
    color: var(--accent);
    letter-spacing: 3px;
  }

  .logo p {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 4px;
    letter-spacing: 1px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
  }

  .field {
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text-dim);
    margin-bottom: 8px;
    text-transform: uppercase;
    font-family: var(--mono);
  }

  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 16px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus { border-color: var(--accent); }

  .error {
    background: #ff445522;
    border: 1px solid #ff445544;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--danger);
    margin-bottom: 20px;
    font-family: var(--mono);
  }

  button {
    width: 100%;
    background: var(--accent);
    color: #0a0c0f;
    border: none;
    border-radius: 6px;
    padding: 14px;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    text-transform: uppercase;
  }

  button:hover { opacity: 0.9; transform: translateY(-1px); }
  button:active { transform: translateY(0); }

  .footer {
    text-align: center;
    margin-top: 24px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
  }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#00d4aa" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>
    <h1>VIGILNODE</h1>
    <p>SECURITY MONITOR</p>
  </div>

  <div class="card">
    {% if error %}
    <div class="error">⚠ {{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" autocomplete="username" autofocus>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" autocomplete="current-password">
      </div>
      <button type="submit">ACCESS DASHBOARD</button>
    </form>
  </div>

  <div class="footer">VIGILNODE v1.0 — SELF-HOSTED</div>
</div>
</body>
</html>
